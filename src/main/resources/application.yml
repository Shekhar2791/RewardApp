spring:
  datasource:
    url: jdbc:h2:mem:rewardsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
  application:
    name: RewardCalculator
  sql:
    init:
      mode: never

server:
  port: 8080

# enable H2 console if you like
spring.h2.console.enabled: true
spring.h2.console.path: /h2-console
